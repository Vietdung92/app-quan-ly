# =====================================================
# Nginx config - App Quản Lý Công Ty
# Đặt tại: /etc/nginx/sites-available/app-quanly
# Kích hoạt: ln -s /etc/nginx/sites-available/app-quanly /etc/nginx/sites-enabled/
# Sau khi có HTTPS, certbot sẽ tự sửa file này (thêm listen 443 ssl)
# =====================================================

server {
    listen 80;
    # THAY ten-mien-cua-ban.com bằng tên miền thật (2 chỗ)
    server_name ten-mien-cua-ban.com www.ten-mien-cua-ban.com;

    # Frontend build (dist của Vite)
    root /var/www/app-quanly/dist;
    index index.html;

    # Nén gzip cho nhanh
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Giới hạn upload 10MB (ảnh hóa đơn sau này)
    client_max_body_size 10m;

    # API → backend Node port 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health check của backend
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Static assets cache 30 ngày (file build có hash trong tên)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html (React Router xử lý)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
