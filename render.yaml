# =====================================================
# Render Blueprint - App Quản Lý Công Ty (Demo miễn phí)
# Đặt file này ở thư mục gốc repo GitHub.
# Trên Render: New + → Blueprint → chọn repo → mọi thứ tự cấu hình.
# =====================================================

services:
  - type: web
    name: app-quanly-demo
    runtime: node
    plan: free
    buildCommand: cd app && npm install --include=dev && npx vite build && cd ../backend && npm install --omit=dev
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_DIST
        value: ../app/dist
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: app-quanly-db
          property: connectionString
      # Bật Telegram thì thêm 2 biến này trong Dashboard → Environment:
      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

databases:
  - name: app-quanly-db
    plan: free
    databaseName: app_quanly_conty
    user: app_user
